name: Agentic Docker Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-diff:
    name: 🔍 Run Code Diff Agent
    runs-on: ubuntu-latest
    outputs:
      build-required: ${{ steps.check.outputs.build_required }}
    steps:
      - name: 🧾 Checkout Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 2  # so Git diff works

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🧠 Run Code Diff Agent
        id: check
        run: |
          pip install GitPython
          python code_diff_agent.py
          if grep -q 'trigger=true' build_trigger; then
            echo "build_required=true" >> $GITHUB_OUTPUT
          else
            echo "build_required=false" >> $GITHUB_OUTPUT
          fi

  docker-build:
    name: 🐳 Conditional Docker Build
    needs: check-diff
    if: needs.check-diff.outputs.build-required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Docker Build
        run: docker build -t agentic-app:latest .
